<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game đoán số</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f5f5;
        }
        .box {
            background: white;
            border: 1px solid #ccc;
            padding: 20px;
            max-width: 420px;
        }
        button {
            padding: 10px 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Mini Game: Đoán số</h1>
        <p>Máy sẽ random một số từ 1 đến 100. Bạn có tối đa 7 lần đoán.</p>
        <button onclick="startGame()">Bắt đầu chơi</button>
        <p id="result">Chưa chơi</p>
    </div>
    <script src="guess.js"></script>
</body>
</html>
