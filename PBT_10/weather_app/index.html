<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <h1>Weather App</h1>
        <p class="note">Nhập tên thành phố để xem thời tiết hiện tại.</p>
        <div class="search-box">
            <input id="cityInput" type="text" placeholder="Ví dụ: Hanoi" value="Hanoi">
            <button id="searchBtn">Tìm</button>
        </div>
        <div id="message"></div>
        <div id="weatherBox" class="weather-box hidden"></div>
        <div class="history">
            <h2>Lịch sử tìm kiếm</h2>
            <div id="historyList"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
