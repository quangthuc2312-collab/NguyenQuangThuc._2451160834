<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations</title>
    <link rel="stylesheet" href="animations.css">
</head>
<body>
    <header class="header">
        <h1>CSS Transitions & Animations</h1>
        <div class="spinner"></div>
    </header>

    <main class="grid">
        <article class="card fade-in">
            <div class="image-wrap"><div class="fake-image">SP 1</div></div>
            <h2>Card Hover</h2>
            <p>Di chuột vào card để thấy hiệu ứng nâng lên.</p>
            <button>Mua ngay</button>
        </article>

        <article class="card fade-in delay-1">
            <div class="image-wrap"><div class="fake-image">SP 2</div></div>
            <h2>Image Zoom</h2>
            <p>Khung sản phẩm phóng to mượt khi hover.</p>
            <button>Mua ngay</button>
        </article>

        <article class="card fade-in delay-2">
            <div class="image-wrap"><div class="fake-image">SP 3</div></div>
            <h2>Button Hover</h2>
            <p>Nút đổi màu và scale nhẹ khi hover.</p>
            <button>Mua ngay</button>
        </article>
    </main>
</body>
</html>
