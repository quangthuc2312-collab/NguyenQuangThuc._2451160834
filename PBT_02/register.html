<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>
    <style>
body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; color: #222; }
main { width: 90%; max-width: 900px; margin: 25px auto; background: white; padding: 20px; border: 1px solid #ddd; }
h1 { margin-top: 0; }
fieldset { margin-bottom: 18px; border: 1px solid #bbb; padding: 15px; }
legend { font-weight: bold; }
label { display: block; margin-top: 10px; }
input, select, textarea, button { width: 100%; box-sizing: border-box; padding: 9px; margin-top: 5px; font-size: 15px; }
input[type="radio"], input[type="checkbox"] { width: auto; margin-right: 6px; }
.inline label { display: inline-block; margin-right: 15px; }
.buttons { display: flex; gap: 10px; }
button { cursor: pointer; background: #333; color: white; border: none; }
button[type="reset"] { background: #777; }
input:invalid { border: 2px solid #c0392b; }
</style>
</head>
<body>
    <main>
        <h1>Đăng ký tài khoản E-Commerce</h1>
        <form action="#" method="POST">
            <fieldset>
                <legend>Thông tin cá nhân</legend>

                <label for="fullname">Họ tên</label>
                <input type="text" id="fullname" name="fullname" required minlength="2" maxlength="50" placeholder="Nguyễn Văn A">

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="you@email.com">

                <label for="phone">Số điện thoại</label>
                <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="0901234567">

                <label for="dob">Ngày sinh</label>
                <input type="date" id="dob" name="dob" max="2026-05-31">
            </fieldset>

            <fieldset>
                <legend>Tài khoản</legend>

                <label for="username">Username</label>
                <input type="text" id="username" name="username" required pattern="[A-Za-z0-9_]{3,20}" placeholder="quang_thuc06">

                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="8" pattern="(?=.*[A-Z])(?=.*[0-9]).{8,}" placeholder="Ví dụ: Abc12345">

                <label for="confirm_password">Xác nhận password</label>
                <input type="password" id="confirm_password" name="confirm_password" required minlength="8" pattern="(?=.*[A-Z])(?=.*[0-9]).{8,}" placeholder="Nhập lại mật khẩu">
            </fieldset>

            <fieldset>
                <legend>Thông tin giao hàng</legend>

                <label for="city">Thành phố</label>
                <select id="city" name="city" required>
                    <option value="">Chọn tỉnh/thành</option>
                    <option value="ha-noi">Hà Nội</option>
                    <option value="tp-hcm">TP.HCM</option>
                    <option value="bac-ninh">Bắc Ninh</option>
                    <option value="da-nang">Đà Nẵng</option>
                    <option value="hai-phong">Hải Phòng</option>
                </select>

                <label for="district">Quận/Huyện</label>
                <select id="district" name="district" required>
                    <option value="">Chọn quận/huyện</option>
                    <option value="hoan-kiem">Hoàn Kiếm</option>
                    <option value="cau-giay">Cầu Giấy</option>
                    <option value="tu-son">Từ Sơn</option>
                    <option value="hai-chau">Hải Châu</option>
                </select>

                <label for="address">Địa chỉ chi tiết</label>
                <textarea id="address" name="address" rows="3" placeholder="Số nhà, tên đường"></textarea>

                <div class="inline">
                    <p>Giới tính</p>
                    <label for="male"><input type="radio" id="male" name="gender" value="nam"> Nam</label>
                    <label for="female"><input type="radio" id="female" name="gender" value="nu"> Nữ</label>
                    <label for="other"><input type="radio" id="other" name="gender" value="khac"> Khác</label>
                </div>

                <label for="agree"><input type="checkbox" id="agree" name="agree" required> Tôi đồng ý với điều khoản</label>
            </fieldset>

            <div class="buttons">
                <button type="submit">Đăng ký</button>
                <button type="reset">Nhập lại</button>
            </div>
        </form>
    </main>
</body>
</html>
